x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "10"

networks:
  playedu:
    driver: bridge

volumes:
  mysql-data:

services:
  playedu:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SERVER_PORT=${PLAYEDU_SERVER_PORT:-9898}
      - PLAYEDU_INSTANCE_ID=${PLAYEDU_INSTANCE_ID:-combined}
      - DB_HOST=${PLAYEDU_DB_HOST:-mysql}
      - DB_PORT=${PLAYEDU_DB_PORT:-3306}
      - DB_NAME=${PLAYEDU_DB_NAME:-playedu}
      - DB_USER=${PLAYEDU_DB_USER:-root}
      - DB_PASS=${PLAYEDU_DB_PASS:-playeduxyz}
      - DB_POOL_MIN_IDLE=${PLAYEDU_DB_POOL_MIN_IDLE:-1}
      - DB_POOL_MAX_SIZE=${PLAYEDU_DB_POOL_MAX_SIZE:-10}
      - DB_POOL_CONN_TIMEOUT=${PLAYEDU_DB_POOL_CONN_TIMEOUT:-30000}
      - DB_POOL_IDLE_TIMEOUT=${PLAYEDU_DB_POOL_IDLE_TIMEOUT:-600000}
      - DB_POOL_MAX_LIFETIME=${PLAYEDU_DB_POOL_MAX_LIFETIME:-1800000}
      - REDIS_HOST=${PLAYEDU_REDIS_HOST:-redis}
      - REDIS_PORT=${PLAYEDU_REDIS_PORT:-6379}
      - REDIS_PASSWORD=${PLAYEDU_REDIS_PASSWORD:-}
      - REDIS_DATABASE=${PLAYEDU_REDIS_DATABASE:-0}
      - REDIS_TIMEOUT=${PLAYEDU_REDIS_TIMEOUT:-2s}
      - REDIS_CONNECT_TIMEOUT=${PLAYEDU_REDIS_CONNECT_TIMEOUT:-2s}
      - PLAYEDU_LIMITER_DURATION=${PLAYEDU_LIMITER_DURATION:-60}
      - PLAYEDU_LIMITER_LIMIT=${PLAYEDU_LIMITER_LIMIT:-360}
      - SA_TOKEN_IS_CONCURRENT=${PLAYEDU_SA_TOKEN_IS_CONCURRENT:-false}
      - SA_TOKEN_JWT_SECRET_KEY=${PLAYEDU_JWT_KEY:-playeduxyz}
      - TZ=${PLAYEDU_TZ:-Asia/Shanghai}
      - DEMO_MODE=${PLAYEDU_DEMO_MODE:-false}
    ports:
      - "${PLAYEDU_API_PORT:-9700}:9898"
      - "${PLAYEDU_PC_PORT:-9800}:9800"
      - "${PLAYEDU_H5_PORT:-9801}:9801"
      - "${PLAYEDU_ADMIN_PORT:-9900}:9900"
    networks:
      - playedu
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
    logging: *default-logging

  mysql:
    build: ./docker/mysql
    restart: always
    environment:
      - MYSQL_DATABASE=${PLAYEDU_DB_NAME:-playedu}
      - MYSQL_ROOT_PASSWORD=${PLAYEDU_DB_PASS:-playeduxyz}
      - TZ=${PLAYEDU_TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-23307}:3306"
    networks:
      - playedu
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: always
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --save "" --appendonly no
    environment:
      - REDIS_PASSWORD=${PLAYEDU_REDIS_PASSWORD:-}
    ports:
      - "${PLAYEDU_REDIS_EXPOSED_PORT:-6379}:6379"
    networks:
      - playedu
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping;
          else redis-cli ping; fi
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
